<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion administrateur | NINICE BOUTIQUE</title>

    <meta

        name="description"

        content="Connexion sécurisée à l'administration de NINICE BOUTIQUE."

    >

    <meta name="theme-color" content="#6d28d9">

    <style>

        * {

            box-sizing: border-box;

        }

        html,

        body {

            margin: 0;

            padding: 0;

            width: 100%;

            min-height: 100%;

            overflow-x: hidden;

        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            background: #f8f7fc;

            color: #17151c;

        }

        .page {

            min-height: 100vh;

            min-height: 100dvh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

        }

        .login-card {

            width: 100%;

            max-width: 430px;

            background: #ffffff;

            border: 1px solid #ece8f5;

            border-radius: 24px;

            padding: 34px 30px;

            box-shadow: 0 18px 50px rgba(44, 26, 75, 0.10);

        }

        .brand {

            text-align: center;

            margin-bottom: 30px;

        }

        .logo {

            width: 68px;

            height: 68px;

            margin: 0 auto 15px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #6d28d9;

            color: white;

            font-size: 27px;

            font-weight: 800;

        }

        .brand-name {

            margin: 0;

            font-size: 23px;

            font-weight: 800;

            color: #4c1d95;

            letter-spacing: -0.4px;

        }

        .brand-subtitle {

            margin: 7px 0 0;

            color: #77717f;

            font-size: 14px;

        }

        .field {

            margin-bottom: 18px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 700;

        }

        input {

            width: 100%;

            height: 50px;

            border: 1px solid #ddd7e8;

            border-radius: 12px;

            padding: 0 14px;

            outline: none;

            font-size: 15px;

            color: #17151c;

            background: #fff;

        }

        input:focus {

            border-color: #6d28d9;

            box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.10);

        }

        .password-wrap {

            position: relative;

        }

        .password-wrap input {

            padding-right: 76px;

        }

        .toggle-password {

            position: absolute;

            right: 8px;

            top: 7px;

            height: 36px;

            padding: 0 10px;

            border: 0;

            border-radius: 9px;

            background: transparent;

            color: #6d28d9;

            font-weight: 700;

            cursor: pointer;

        }

        .submit-btn {

            width: 100%;

            height: 51px;

            border: 0;

            border-radius: 12px;

            background: #6d28d9;

            color: #fff;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;

        }

        .submit-btn:hover {

            background: #5b21b6;

        }

        .submit-btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;

        }

        .status {

            display: none;

            margin-bottom: 17px;

            padding: 12px 14px;

            border-radius: 11px;

            font-size: 14px;

            line-height: 1.45;

        }

        .status.show {

            display: block;

        }

        .status.error {

            background: #fff1f2;

            color: #be123c;

            border: 1px solid #fecdd3;

        }

        .status.success {

            background: #f0fdf4;

            color: #15803d;

            border: 1px solid #bbf7d0;

        }

        .back-link {

            display: block;

            margin-top: 20px;

            text-align: center;

            color: #6d28d9;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

        }

        .security-note {

            margin-top: 24px;

            padding-top: 18px;

            border-top: 1px solid #eeeaf3;

            text-align: center;

            color: #85808c;

            font-size: 12px;

            line-height: 1.5;

        }

        @media (max-width: 480px) {

            .page {

                padding: 14px;

                align-items: flex-start;

                padding-top: 30px;

            }

            .login-card {

                padding: 28px 20px;

                border-radius: 20px;

            }

            .brand-name {

                font-size: 21px;

            }

        }

    </style>

</head>

<body>

<div class="page">

    <main class="login-card">

        <div class="brand">

            <div class="logo">N</div>

            <h1 class="brand-name">

                NINICE BOUTIQUE

            </h1>

            <p class="brand-subtitle">

                Administration sécurisée

            </p>

        </div>

        <div id="status" class="status"></div>

        <form id="loginForm">

            <div class="field">

                <label for="email">Adresse e-mail</label>

                <input

                    type="email"

                    id="email"

                    autocomplete="email"

                    required

                    placeholder="Votre adresse e-mail"

                >

            </div>

            <div class="field">

                <label for="password">Mot de passe</label>

                <div class="password-wrap">

                    <input

                        type="password"

                        id="password"

                        autocomplete="current-password"

                        required

                        placeholder="Votre mot de passe"

                    >

                    <button

                        type="button"

                        class="toggle-password"

                        id="togglePassword"

                    >

                        Afficher

                    </button>

                </div>

            </div>

            <button

                type="submit"

                class="submit-btn"

                id="submitBtn"

            >

                Se connecter

            </button>

        </form>

        <a

            class="back-link"

            href="../index.html"

        >

            Retour à la boutique

        </a>

        <div class="security-note">

            Accès réservé à l'administration de NINICE BOUTIQUE.

        </div>

    </main>

</div>

<script src="../assets/js/config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase.js"></script>

<script>

(function () {

    "use strict";

    const form = document.getElementById("loginForm");

    const emailInput = document.getElementById("email");

    const passwordInput = document.getElementById("password");

    const submitBtn = document.getElementById("submitBtn");

    const togglePassword = document.getElementById("togglePassword");

    const statusBox = document.getElementById("status");

    function showStatus(message, type) {

        statusBox.textContent = message;

        statusBox.className = "status show " + type;

    }

    function hideStatus() {

        statusBox.textContent = "";

        statusBox.className = "status";

    }

    togglePassword.addEventListener("click", function () {

        const isPassword =

            passwordInput.type === "password";

        passwordInput.type =

            isPassword ? "text" : "password";

        togglePassword.textContent =

            isPassword ? "Masquer" : "Afficher";

    });

    async function checkAdminAccess() {

        if (!window.niniceSupabase) {

            return false;

        }

        try {

            const {

                data: {

                    session

                },

                error: sessionError

            } = await window.niniceSupabase.auth.getSession();

            if (sessionError || !session) {

                return false;

            }

            const {

                data: adminResult,

                error: adminError

            } = await window.niniceSupabase.rpc("is_admin");

            if (adminError) {

                console.error(

                    "Erreur is_admin:",

                    adminError

                );

                return false;

            }

            return adminResult === true;

        } catch (error) {

            console.error(

                "Erreur vérification admin:",

                error

            );

            return false;

        }

    }

    async function redirectIfAlreadyConnected() {

        const isAdmin =

            await checkAdminAccess();

        if (isAdmin) {

            window.location.replace(

                "index.html"

            );

        }

    }

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        hideStatus();

        const email =

            emailInput.value.trim();

        const password =

            passwordInput.value;

        if (!email || !password) {

            showStatus(

                "Veuillez remplir tous les champs.",

                "error"

            );

            return;

        }

        submitBtn.disabled = true;

        submitBtn.textContent =

            "Connexion...";

        try {

            if (!window.niniceSupabase) {

                throw new Error(

                    "La connexion à Supabase n'est pas disponible."

                );

            }

            const {

                data,

                error

            } =

                await window.niniceSupabase.auth.signInWithPassword({

                    email: email,

                    password: password

                });

            if (error) {

                throw error;

            }

            if (!data || !data.session) {

                throw new Error(

                    "La connexion n'a pas pu être établie."

                );

            }

            showStatus(

                "Connexion réussie. Vérification de vos accès...",

                "success"

            );

            /*

             * Petite pause pour laisser Supabase

             * enregistrer correctement la session.

             */

            await new Promise(function (resolve) {

                setTimeout(resolve, 400);

            });

            const isAdmin =

                await checkAdminAccess();

            if (!isAdmin) {

                await window.niniceSupabase.auth.signOut();

                throw new Error(

                    "Votre compte est connecté, mais il n'est pas autorisé à accéder à l'administration."

                );

            }

            window.location.replace(

                "index.html"

            );

        } catch (error) {

            console.error(

                "Erreur connexion admin:",

                error

            );

            showStatus(

                error.message ||

                "Impossible de se connecter.",

                "error"

            );

            submitBtn.disabled = false;

            submitBtn.textContent =

                "Se connecter";

        }

    });

    /*

     * Vérification unique au chargement.

     * Aucun intervalle permanent :

     * cela évite l'écran qui tourne ou qui bouge.

     */

    redirectIfAlreadyConnected();

})();

</script>

</body>

</html>
