<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conseil | NINICE BOUTIQUE</title>

    <meta

        name="description"

        content="Conseils mode et astuces NINICE BOUTIQUE."

    >

    <meta name="theme-color" content="#6d28d9">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link

        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"

        rel="stylesheet"

    >

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet" href="../assets/css/responsive.css">

    <style>

        :root {

            --violet: #6d28d9;

            --violet-dark: #4c1d95;

            --violet-light: #f5f3ff;

            --text: #18181b;

            --muted: #71717a;

            --border: #e4e4e7;

            --white: #ffffff;

            --danger: #dc2626;

        }

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;

            background: #fafafa;

            color: var(--text);

            font-family: "DM Sans", sans-serif;

        }

        .article-page {

            width: min(900px, calc(100% - 28px));

            margin: 0 auto;

            padding: 35px 0 100px;

        }

        .back-link {

            display: inline-flex;

            align-items: center;

            margin-bottom: 25px;

            color: var(--violet);

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

        }

        .back-link:hover {

            color: var(--violet-dark);

        }

        .article-card {

            overflow: hidden;

            background: var(--white);

            border: 1px solid var(--border);

            border-radius: 20px;

            box-shadow: 0 10px 35px rgba(24, 24, 27, 0.06);

        }

        .article-image-wrapper {

            width: 100%;

            max-height: 500px;

            background: var(--violet-light);

            overflow: hidden;

        }

        .article-image {

            display: block;

            width: 100%;

            max-height: 500px;

            object-fit: cover;

        }

        .article-content {

            padding: 40px;

        }

        .article-date {

            margin-bottom: 12px;

            color: var(--muted);

            font-size: 13px;

        }

        .article-title {

            margin: 0 0 25px;

            color: var(--violet-dark);

            font-family: "Playfair Display", serif;

            font-size: clamp(32px, 5vw, 48px);

            line-height: 1.2;

        }

        .article-excerpt {

            margin-bottom: 30px;

            padding: 18px 20px;

            border-left: 4px solid var(--violet);

            border-radius: 0 10px 10px 0;

            background: var(--violet-light);

            color: #52525b;

            font-size: 16px;

            line-height: 1.7;

        }

        .article-body {

            color: #3f3f46;

            font-size: 16px;

            line-height: 1.9;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

        }

        .article-status {

            padding: 35px 20px;

            border: 1px solid var(--border);

            border-radius: 16px;

            background: var(--white);

            color: var(--muted);

            text-align: center;

        }

        .article-status.error {

            border-color: #fecaca;

            background: #fef2f2;

            color: var(--danger);

        }

        @media (max-width: 600px) {

            .article-page {

                padding-top: 25px;

            }

            .article-card {

                border-radius: 15px;

            }

            .article-content {

                padding: 24px 18px;

            }

            .article-title {

                font-size: 32px;

            }

            .article-excerpt {

                padding: 15px;

                font-size: 14px;

            }

            .article-body {

                font-size: 15px;

                line-height: 1.8;

            }

        }

    </style>

</head>

<body>

<header id="site-header"></header>

<main class="article-page">

    <a href="conseils.html" class="back-link">

        Retour aux conseils

    </a>

    <div id="article-container">

        <div class="article-status">

            Chargement du conseil...

        </div>

    </div>

</main>

<footer id="site-footer"></footer>

<script src="../assets/js/config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase.js"></script>

<script src="../assets/js/common.js"></script>

<script src="../assets/js/navigation.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async function () {

    const container =

        document.getElementById("article-container");

    function escapeHTML(value) {

        return String(value ?? "")

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");

    }

    function formatDate(value) {

        if (!value) {

            return "";

        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {

            return "";

        }

        return new Intl.DateTimeFormat("fr-FR", {

            day: "2-digit",

            month: "long",

            year: "numeric"

        }).format(date);

    }

    function showError(message) {

        container.innerHTML = `

            <div class="article-status error">

                ${escapeHTML(message)}

            </div>

        `;

    }

    if (!window.niniceSupabase) {

        showError(

            "La connexion à la boutique n'est pas disponible."

        );

        return;

    }

    const params =

        new URLSearchParams(window.location.search);

    const id = params.get("id");

    const slug = params.get("slug");

    console.log(

        "NINICE CONSEIL — ID :",

        id,

        "SLUG :",

        slug

    );

    /*

     * Aucun identifiant :

     * on ne fait pas de requête inutile.

     */

    if (!id && !slug) {

        showError(

            "Ouvre un conseil depuis la page « Conseils » pour consulter son contenu."

        );

        return;

    }

    try {

        let query = window.niniceSupabase

            .from("advice")

            .select(`

                id,

                title,

                slug,

                excerpt,

                content,

                image_url,

                is_published,

                is_featured,

                created_at,

                updated_at

            `)

            .eq("is_published", true);

        /*

         * Si l'URL contient un ID,

         * on utilise prioritairement l'ID.

         */

        if (id) {

            query = query.eq("id", id);

        } else if (slug) {

            query = query.eq("slug", slug);

        }

        const result = await query;

        if (result.error) {

            throw result.error;

        }

        const data = result.data;

        console.log(

            "NINICE CONSEIL — résultat :",

            data

        );

        if (!data || data.length === 0) {

            showError(

                "Ce conseil n'existe pas, n'est pas publié ou son lien est incorrect."

            );

            return;

        }

        const article = data[0];

        document.title =

            `${article.title} | NINICE BOUTIQUE`;

        const imageHTML = article.image_url

            ? `

                <div class="article-image-wrapper">

                    <img

                        class="article-image"

                        src="${escapeHTML(article.image_url)}"

                        alt="${escapeHTML(article.title)}"

                        onerror="this.parentElement.style.display='none';"

                    >

                </div>

            `

            : "";

        const excerptHTML = article.excerpt

            ? `

                <div class="article-excerpt">

                    ${escapeHTML(article.excerpt)}

                </div>

            `

            : "";

        container.innerHTML = `

            <article class="article-card">

                ${imageHTML}

                <div class="article-content">

                    <div class="article-date">

                        Publié le

                        ${escapeHTML(

                            formatDate(article.created_at)

                        )}

                    </div>

                    <h1 class="article-title">

                        ${escapeHTML(article.title)}

                    </h1>

                    ${excerptHTML}

                    <div class="article-body">

                        ${escapeHTML(article.content)}

                    </div>

                </div>

            </article>

        `;

    } catch (error) {

        console.error(

            "NINICE CONSEIL — erreur :",

            error

        );

        showError(

            "Une erreur est survenue lors du chargement du conseil."

        );

    }

});

</script>

</body>

</html>
