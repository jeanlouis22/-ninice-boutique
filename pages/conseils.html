<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conseils | NINICE BOUTIQUE</title>

    <meta

        name="description"

        content="Découvrez les conseils NINICE BOUTIQUE sur la mode, l'entretien, les tailles, les perruques, les sacs et les accessoires."

    >

    <meta name="theme-color" content="#6d28d9">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link

        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"

        rel="stylesheet"

    >

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet" href="../assets/css/responsive.css">

    <style>

        :root {

            --violet: #6d28d9;

            --violet-dark: #4c1d95;

            --violet-light: #f5f3ff;

            --text: #18181b;

            --muted: #71717a;

            --border: #e4e4e7;

            --white: #ffffff;

            --danger: #dc2626;

        }

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;

            background: #fafafa;

            color: var(--text);

            font-family: "DM Sans", sans-serif;

        }

        .advice-page {

            max-width: 1200px;

            margin: 0 auto;

            padding: 35px 20px 100px;

        }

        .advice-hero {

            text-align: center;

            margin-bottom: 35px;

        }

        .advice-hero h1 {

            margin: 0 0 10px;

            font-family: "Playfair Display", serif;

            color: var(--violet-dark);

            font-size: clamp(32px, 5vw, 48px);

        }

        .advice-hero p {

            max-width: 700px;

            margin: 0 auto;

            color: var(--muted);

            line-height: 1.7;

            font-size: 15px;

        }

        .advice-status {

            max-width: 800px;

            margin: 0 auto 25px;

            padding: 14px 18px;

            border-radius: 12px;

            text-align: center;

            display: none;

            font-size: 14px;

        }

        .advice-status.show {

            display: block;

        }

        .advice-status.error {

            background: #fef2f2;

            color: var(--danger);

            border: 1px solid #fecaca;

        }

        .advice-grid {

            display: grid;

            grid-template-columns: repeat(3, minmax(0, 1fr));

            gap: 24px;

        }

        .advice-card {

            background: var(--white);

            border: 1px solid var(--border);

            border-radius: 18px;

            overflow: hidden;

            box-shadow: 0 8px 25px rgba(24, 24, 27, 0.05);

            transition:

                transform 0.2s ease,

                box-shadow 0.2s ease;

        }

        .advice-card:hover {

            transform: translateY(-4px);

            box-shadow: 0 15px 35px rgba(24, 24, 27, 0.09);

        }

        .advice-image-wrapper {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 10;

            background: var(--violet-light);

            overflow: hidden;

        }

        .advice-image {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }

        .advice-featured {

            position: absolute;

            top: 14px;

            left: 14px;

            padding: 7px 11px;

            border-radius: 999px;

            background: var(--violet);

            color: var(--white);

            font-size: 11px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.04em;

        }

        .advice-content {

            padding: 20px;

        }

        .advice-date {

            margin-bottom: 8px;

            color: var(--muted);

            font-size: 12px;

        }

        .advice-title {

            margin: 0 0 10px;

            color: var(--violet-dark);

            font-family: "Playfair Display", serif;

            font-size: 23px;

            line-height: 1.25;

        }

        .advice-excerpt {

            margin: 0 0 18px;

            color: #52525b;

            font-size: 14px;

            line-height: 1.7;

        }

        .advice-read {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 42px;

            padding: 10px 17px;

            border-radius: 10px;

            background: var(--violet);

            color: var(--white);

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            transition: background 0.2s ease;

        }

        .advice-read:hover {

            background: var(--violet-dark);

        }

        .advice-empty {

            grid-column: 1 / -1;

            max-width: 650px;

            margin: 20px auto;

            padding: 45px 25px;

            border: 1px dashed #c4b5fd;

            border-radius: 18px;

            background: var(--violet-light);

            text-align: center;

        }

        .advice-empty h2 {

            margin: 0 0 10px;

            color: var(--violet-dark);

            font-family: "Playfair Display", serif;

            font-size: 25px;

        }

        .advice-empty p {

            margin: 0;

            color: var(--muted);

            line-height: 1.7;

            font-size: 14px;

        }

        .advice-loading {

            grid-column: 1 / -1;

            padding: 50px 20px;

            text-align: center;

            color: var(--muted);

        }

        @media (max-width: 900px) {

            .advice-grid {

                grid-template-columns: repeat(2, minmax(0, 1fr));

            }

        }

        @media (max-width: 600px) {

            .advice-page {

                padding: 25px 14px 100px;

            }

            .advice-hero {

                margin-bottom: 25px;

            }

            .advice-hero h1 {

                font-size: 34px;

            }

            .advice-grid {

                grid-template-columns: 1fr;

                gap: 18px;

            }

            .advice-card {

                border-radius: 15px;

            }

            .advice-content {

                padding: 17px;

            }

            .advice-title {

                font-size: 21px;

            }

        }

    </style>

</head>

<body>

<header id="site-header"></header>

<main class="advice-page">

    <section class="advice-hero">

        <h1>Conseils</h1>

        <p>

            Retrouvez nos conseils pour mieux choisir vos vêtements,

            entretenir vos articles et prendre soin de votre style au quotidien.

        </p>

    </section>

    <div

        id="advice-status"

        class="advice-status"

        role="status"

        aria-live="polite"

    ></div>

    <section

        id="advice-grid"

        class="advice-grid"

        aria-live="polite"

    >

        <div class="advice-loading">

            Chargement des conseils...

        </div>

    </section>

</main>

<footer id="site-footer"></footer>

<script src="../assets/js/config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase.js"></script>

<script src="../assets/js/common.js"></script>

<script src="../assets/js/navigation.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async function () {

    const grid =

        document.getElementById("advice-grid");

    const status =

        document.getElementById("advice-status");

    function escapeHTML(value) {

        return String(value ?? "")

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");

    }

    function formatDate(value) {

        if (!value) {

            return "";

        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {

            return "";

        }

        return new Intl.DateTimeFormat("fr-FR", {

            day: "2-digit",

            month: "long",

            year: "numeric"

        }).format(date);

    }

    function showError(message) {

        status.textContent = message;

        status.className =

            "advice-status show error";

    }

    if (!window.niniceSupabase) {

        grid.innerHTML = "";

        showError(

            "La connexion à la boutique n'est pas disponible."

        );

        return;

    }

    try {

        const {

            data,

            error

        } = await window.niniceSupabase

            .from("advice")

            .select(`

                id,

                title,

                slug,

                excerpt,

                content,

                image_url,

                is_published,

                is_featured,

                created_at,

                updated_at

            `)

            .eq("is_published", true)

            .order("is_featured", {

                ascending: false

            })

            .order("created_at", {

                ascending: false

            });

        if (error) {

            throw error;

        }

        if (!data || data.length === 0) {

            grid.innerHTML = `

                <div class="advice-empty">

                    <h2>

                        Nos conseils arrivent bientôt

                    </h2>

                    <p>

                        De nouveaux conseils sur la mode,

                        l'entretien et les accessoires seront

                        bientôt disponibles ici.

                    </p>

                </div>

            `;

            return;

        }

        status.className =

            "advice-status";

        grid.innerHTML = data.map(function (advice) {

            const excerpt =

                advice.excerpt ||

                String(advice.content || "").slice(0, 160) +

                "...";

            const imageHTML =

                advice.image_url

                ? `

                    <img

                        class="advice-image"

                        src="${escapeHTML(advice.image_url)}"

                        alt="${escapeHTML(advice.title)}"

                        loading="lazy"

                    >

                `

                : "";

            const featuredHTML =

                advice.is_featured

                ? `

                    <span class="advice-featured">

                        À la une

                    </span>

                `

                : "";

            /*

             * IMPORTANT :

             * On utilise uniquement l'ID Supabase.

             */

            const link =

                `conseil.html?id=${encodeURIComponent(advice.id)}`;

            return `

                <article class="advice-card">

                    <div class="advice-image-wrapper">

                        ${imageHTML}

                        ${featuredHTML}

                    </div>

                    <div class="advice-content">

                        <div class="advice-date">

                            ${escapeHTML(

                                formatDate(advice.created_at)

                            )}

                        </div>

                        <h2 class="advice-title">

                            ${escapeHTML(advice.title)}

                        </h2>

                        <p class="advice-excerpt">

                            ${escapeHTML(excerpt)}

                        </p>

                        <a

                            class="advice-read"

                            href="${link}"

                        >

                            Lire le conseil

                        </a>

                    </div>

                </article>

            `;

        }).join("");

    } catch (error) {

        console.error(

            "NINICE CONSEILS — erreur :",

            error

        );

        grid.innerHTML = "";

        showError(

            "Impossible de charger les conseils pour le moment."

        );

    }

});

</script>

</body>

</html
